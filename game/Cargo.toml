[package]
name = "busmanager"
version.workspace = true
edition.workspace = true

[dependencies]
# Only the 2D parts of Bevy are needed (smaller binary, faster builds, works on weaker GPUs)
bevy = { version = "0.16", default-features = false, features = [
    "std", "async_executor", "multi_threaded",
    "bevy_asset", "bevy_color", "bevy_core_pipeline", "bevy_gizmos", "bevy_log",
    "bevy_render", "bevy_sprite", "bevy_state", "bevy_text", "bevy_ui",
    "bevy_window", "bevy_winit", "x11", "wayland",
    # 3D depot, glTF bus models (also used for player-made bus mods)
    "bevy_pbr", "bevy_gltf", "bevy_scene", "png", "jpeg",
] }
osmpbfreader = "0.19"
petgraph = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure-Rust TLS (rustls): no OpenSSL needed on Windows/macOS/Linux
ureq = "2"
dirs = "6"
# Polygon triangulation for buildings, parks and water
earcutr = "0.4"
# Window icon
winit = "0.30"
# Discord Rich Presence (talks to the local Discord client; silently does nothing if Discord is closed)
discord-rich-presence = "1"
# In-game updater: unpack the downloaded release and verify its checksum
flate2 = "1"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.10"

[build-dependencies]
winresource = "0.1"
