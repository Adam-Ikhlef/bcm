name: Bug report
description: Something is broken or behaves wrongly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Issues must be written in English.** Issues in other languages are closed automatically.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. New game, city ...\n2. Create a line ...\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Game version
      description: Shown on the main menu and in Options.
      placeholder: "0.3.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: Graphics card and driver (if relevant)
  - type: textarea
    id: logs
    attributes:
      label: Crash log
      description: Paste the contents of `crash.log` (next to the game) or the terminal output.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues first
          required: true
        - label: I am using the latest release
