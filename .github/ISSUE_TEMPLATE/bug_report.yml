name: Bug Report
description: Report a crash, simulation bug, map/route issue, or installer problem
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve **Bus Company Manager**! Please fill out as much detail as you can so we can reproduce the issue.

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Where did the issue occur?
      options:
        - Game (`busmanager`)
        - Installer (`busmanager-installer`)
        - Map / Route / Pathfinding
        - Simulation / Economy / Fleet
        - UI / Rendering / Audio
        - Save / Load / Config
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or Commit
      description: Release tag (e.g. `v0.2.0`) or commit SHA if built from source
      placeholder: "e.g. v0.2.0 or 1a2b3c4"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows (10 / 11)
        - Linux (X11)
        - Linux (Wayland)
        - macOS
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug clearly and what you expected to happen instead.
      placeholder: "e.g. Creating a route between Stop A and Stop B caused a panic or infinite loop..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: List the exact steps needed to trigger the issue.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Click ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Backtrace / Screenshots
      description: Paste any console output, panic backtrace, or installer logs inside a code block.
      render: shell
      placeholder: |
        Paste logs or backtrace here...

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checks
      options:
        - label: I searched existing issues to make sure this hasn't already been reported.
          required: true
        - label: I am running without custom/unsupported local edits or mods (or noted them above).
          required: false