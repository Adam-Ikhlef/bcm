name: Security

# Code scanning (CodeQL for Rust and GitHub Actions) runs from GitHub's "default setup"
# (Settings > Advanced Security > Code scanning), so it is not repeated here: an advanced CodeQL
# workflow cannot upload results while the default setup is on.

on:
  push:
    branches: [main]
    paths: ["**/Cargo.toml", "Cargo.lock", ".github/workflows/**"]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # every Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency vulnerabilities (cargo audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review (pull requests)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
