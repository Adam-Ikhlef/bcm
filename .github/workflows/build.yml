name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            ext: ""
          - os: windows-latest
            name: windows
            ext: ".exe"
          - os: macos-latest
            name: macos
            ext: ""
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Package
        shell: bash
        run: |
          mkdir -p dist/busmanager
          cp target/release/busmanager${{ matrix.ext }} dist/busmanager/
          mkdir -p dist/busmanager/assets
          cp README.md dist/busmanager/
          tar -czf busmanager-${{ matrix.name }}.tar.gz -C dist busmanager

      - uses: actions/upload-artifact@v4
        with:
          name: busmanager-${{ matrix.name }}
          path: busmanager-${{ matrix.name }}.tar.gz

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: busmanager-${{ matrix.name }}.tar.gz
