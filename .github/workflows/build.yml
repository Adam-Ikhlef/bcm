name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

env:
  # The installer downloads releases from this repository.
  BUSMANAGER_REPO: ${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build game and installer
        run: cargo build --release --workspace

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/pack
          cp target/release/busmanager dist/pack/
          tar -czf dist/busmanager-${{ matrix.name }}.tar.gz -C dist/pack busmanager
          cp target/release/busmanager-installer dist/BusManager-Setup-${{ matrix.name }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/busmanager.exe -DestinationPath dist/busmanager-windows.zip
          Copy-Item target/release/busmanager-installer.exe dist/BusManager-Setup-windows.exe

      - uses: actions/upload-artifact@v4
        with:
          name: busmanager-${{ matrix.name }}
          path: dist/*

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
