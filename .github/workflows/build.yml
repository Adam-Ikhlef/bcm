name: Build

# Builds for Windows (x64, ARM64), macOS (Apple silicon, Intel) and Linux (x64, ARM64).
# Pushes to main keep the files as workflow artifacts; a version tag (v1.2.3) also attaches them to
# the GitHub Release. Pull requests are built by "PR test builds".

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Only this job may write to releases.
    permissions:
      contents: write
    uses: ./.github/workflows/build-reusable.yml
    with:
      installers: true
      publish: ${{ startsWith(github.ref, 'refs/tags/v') }}
