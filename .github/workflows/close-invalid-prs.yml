name: Close invalid PRs

# Closes pull requests that cannot be reviewed as they are, with a comment that says why and how to
# fix it. It only reads the pull request's metadata and never checks out or runs the PR's code, so
# it is safe to run with pull_request_target. People who have write access are never closed.

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            if (pr.user.type === 'Bot') return;                                   // Dependabot etc.
            if (['OWNER', 'MEMBER', 'COLLABORATOR'].includes(pr.author_association)) return;

            const reasons = [];

            // Wrong target branch
            if (pr.base.ref !== pr.base.repo.default_branch) {
              reasons.push(`Pull requests must target \`${pr.base.repo.default_branch}\` (this one targets \`${pr.base.ref}\`).`);
            }

            // Empty description
            const body = (pr.body || '').replace(/<!--[\s\S]*?-->/g, '').replace(/^#+ .*$/gm, '').replace(/- \[[ xX]\].*$/gm, '').trim();
            if (body.length < 20) reasons.push('The description is empty. Please explain what changes and why.');

            // Not English
            const text = `${pr.title}\n${pr.body || ''}`
              .replace(/```[\s\S]*?```/g, ' ').replace(/`[^`]*`/g, ' ').replace(/https?:\/\/\S+/g, ' ');
            const letters = text.match(/\p{L}/gu) || [];
            const latin = text.match(/\p{Script=Latin}/gu) || [];
            if (letters.length >= 12 && 1 - latin.length / letters.length >= 0.3) {
              reasons.push('The title and description must be written in English.');
            }

            // Nothing to review, or changes to the project's automation from outside the team
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number, per_page: 100 });
            if (files.length === 0) reasons.push('The pull request changes no files.');
            if (files.some(f => f.filename.startsWith('.github/'))) {
              reasons.push('Changes to `.github/` (workflows, security settings) are only accepted from maintainers. Please open an issue to discuss the idea.');
            }
            if (files.some(f => /\.(exe|dll|so|dylib|msi|dmg|pkg|jar|apk)$/i.test(f.filename) && f.status !== 'removed')) {
              reasons.push('Compiled binaries cannot be part of a pull request.');
            }

            if (reasons.length === 0) return;

            await github.rest.issues.createComment({
              owner, repo, issue_number: pr.number,
              body: `Thanks for the contribution! This pull request was closed automatically because:\n\n${reasons.map(r => `- ${r}`).join('\n')}\n\n` +
                    'Please fix this and open a new pull request (or reopen this one after editing it). See the pull request template and CONTRIBUTING notes in the README.',
            });
            await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: ['invalid'] }).catch(() => {});
            await github.rest.pulls.update({ owner, repo, pull_number: pr.number, state: 'closed' });
